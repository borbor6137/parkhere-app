<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParkHere</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>

<!-- ชุดไอคอน/โลโก้ SVG (ใช้ผ่าน <use href="#id">; สีมาจาก currentColor และตัวแปรใน style.css) -->
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="logo-mark" viewBox="0 0 64 64">
    <rect class="lg-bg" x="2" y="2" width="60" height="60" rx="14"/>
    <rect class="lg-rim" x="6.5" y="6.5" width="51" height="51" rx="10"/>
    <path class="lg-p" d="M23 43V18h9a8 8 0 0 1 0 16H23"/>
    <circle class="lg-dot" cx="31.6" cy="26" r="2.6"/>
    <rect class="lg-bar" x="15" y="48" width="34" height="6" rx="3"/>
    <path class="lg-str" d="M22 48l-3 6M29 48l-3 6M36 48l-3 6M43 48l-3 6"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h3.5V15h5v5.5H18a1 1 0 0 0 1-1V10"/>
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M9 11h6M9 15h4"/>
  </symbol>
  <symbol id="i-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 11 7 7.3A2 2 0 0 1 8.9 6h6.2A2 2 0 0 1 17 7.3L18.5 11"/><path d="M4 11h16a1 1 0 0 1 1 1v4.5H3V12a1 1 0 0 1 1-1z"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>
  </symbol>
  <symbol id="i-plate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M7 10.5h10M7 13.5h5"/>
  </symbol>
  <!-- ไอคอนสถานะช่องจอด (ใช้ใน .slot-ico ของแผนผังและ legend): ว่าง=i-free จองแล้ว=i-clock มีรถ=i-car ของฉัน=i-p ปิด=i-ban -->
  <symbol id="i-free" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.7 2.7 5-5.6"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  </symbol>
  <symbol id="i-p" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 19.5V4.5h4.6a4 4 0 0 1 0 8H8.5"/>
  </symbol>
  <symbol id="i-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>
  </symbol>
  <symbol id="i-user"viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>
  </symbol>
</svg>

<div class="screen active" id="loading">
  <div class="logo" id="logo1" role="img" aria-label="ParkHere"><svg class="mark" aria-hidden="true" focusable="false"><use href="#logo-mark"/></svg><span class="wm">PARK<b>HERE</b></span><small>จองที่จอดเลย</small></div>
  <div class="bar"><i id="fill"></i></div>
</div>

<div class="screen" id="login">
  <div class="logo" id="logo2" role="img" aria-label="ParkHere"><svg class="mark" aria-hidden="true" focusable="false"><use href="#logo-mark"/></svg><span class="wm">PARK<b>HERE</b></span><small>จองที่จอดเลย</small></div>
  <div class="card">
    <h2>เข้าสู่ระบบ</h2>
    <label>อีเมล</label><input id="l-email" type="email" autocomplete="email">
    <label>รหัสผ่าน</label><input id="l-pass" type="password" autocomplete="current-password">
    <button id="btn-login">เข้าสู่ระบบ</button>
    <div class="msg" id="l-msg"></div>
    <div class="links"><a role="button" tabindex="0" data-go="forgot">ลืมรหัสผ่าน?</a><a role="button" tabindex="0" data-go="signup">สมัครสมาชิก</a></div>
  </div>
</div>

<div class="screen" id="signup">
  <div class="card">
    <h2>สมัครสมาชิก</h2>
    <label>ชื่อผู้ใช้</label><input id="s-user" autocomplete="username">
    <label>รหัสผ่าน</label><input id="s-pass" type="password" autocomplete="new-password">
    <label>ยืนยันรหัสผ่าน</label><input id="s-pass2" type="password" autocomplete="new-password">
    <label>อีเมล</label><input id="s-email" type="email">
    <label>ทะเบียนรถ</label><input id="s-plate" placeholder="เช่น กข 1234">
    <label>จังหวัดบนป้ายทะเบียน</label><select id="s-prov" class="prov"><option>กรุงเทพมหานคร</option><option>กระบี่</option><option>กาญจนบุรี</option><option>กาฬสินธุ์</option><option>กำแพงเพชร</option><option>ขอนแก่น</option><option>จันทบุรี</option><option>ฉะเชิงเทรา</option><option>ชลบุรี</option><option>ชัยนาท</option><option>ชัยภูมิ</option><option>ชุมพร</option><option>เชียงราย</option><option>เชียงใหม่</option><option>ตรัง</option><option>ตราด</option><option>ตาก</option><option>นครนายก</option><option>นครปฐม</option><option>นครพนม</option><option>นครราชสีมา</option><option>นครศรีธรรมราช</option><option>นครสวรรค์</option><option>นนทบุรี</option><option>นราธิวาส</option><option>น่าน</option><option>บึงกาฬ</option><option>บุรีรัมย์</option><option>ปทุมธานี</option><option>ประจวบคีรีขันธ์</option><option>ปราจีนบุรี</option><option>ปัตตานี</option><option>พระนครศรีอยุธยา</option><option>พะเยา</option><option>พังงา</option><option>พัทลุง</option><option>พิจิตร</option><option>พิษณุโลก</option><option>เพชรบุรี</option><option>เพชรบูรณ์</option><option>แพร่</option><option>ภูเก็ต</option><option>มหาสารคาม</option><option>มุกดาหาร</option><option>แม่ฮ่องสอน</option><option>ยโสธร</option><option>ยะลา</option><option>ร้อยเอ็ด</option><option>ระนอง</option><option>ระยอง</option><option>ราชบุรี</option><option>ลพบุรี</option><option>ลำปาง</option><option>ลำพูน</option><option>เลย</option><option>ศรีสะเกษ</option><option>สกลนคร</option><option>สงขลา</option><option>สตูล</option><option>สมุทรปราการ</option><option>สมุทรสงคราม</option><option>สมุทรสาคร</option><option>สระแก้ว</option><option>สระบุรี</option><option>สิงห์บุรี</option><option>สุโขทัย</option><option>สุพรรณบุรี</option><option>สุราษฎร์ธานี</option><option>สุรินทร์</option><option>หนองคาย</option><option>หนองบัวลำภู</option><option>อ่างทอง</option><option>อำนาจเจริญ</option><option>อุดรธานี</option><option>อุตรดิตถ์</option><option>อุทัยธานี</option><option>อุบลราชธานี</option></select>
    <button id="btn-signup">สมัครสมาชิก</button>
    <div class="msg" id="s-msg"></div>
    <div class="links"><a role="button" tabindex="0" data-go="login">← กลับไปเข้าสู่ระบบ</a></div>
  </div>
</div>

<div class="screen" id="forgot">
  <div class="card">
    <h2>ลืมรหัสผ่าน</h2>
    <label>อีเมลที่สมัครไว้</label><input id="f-email" type="email">
    <button id="btn-forgot">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
    <div class="msg" id="f-msg"></div>
    <div class="links"><a role="button" tabindex="0" data-go="login">← กลับไปเข้าสู่ระบบ</a></div>
  </div>
</div>

<div class="screen" id="entering">
  <div class="logo" id="logo3" role="img" aria-label="ParkHere"><svg class="mark" aria-hidden="true" focusable="false"><use href="#logo-mark"/></svg><span class="wm">PARK<b>HERE</b></span><small>จองที่จอดเลย</small></div>
  <div class="bar"><i id="fill2"></i></div>
</div>

<div class="screen" id="home">
  <div id="livebar" class="livebar" role="status" aria-live="polite" hidden></div>
  <div id="view"></div>
  <nav id="nav">
    <button data-a="v" data-v="home"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-home"/></svg>หน้าหลัก</button>
    <button data-a="v" data-v="books"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-book"/></svg>การจอง</button>
    <button class="fab" data-a="v" data-v="floors" aria-label="เลือกชั้นจอดรถ"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-car"/></svg></button>
    <button data-a="v" data-v="cars"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-plate"/></svg>รถของฉัน</button>
    <button data-a="v" data-v="me"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-user"/></svg>โปรไฟล์</button>
  </nav>
  <div id="modal"></div>
</div>

<div id="toast"></div>
<button id="lang-btn" type="button">EN</button>
<script src="qrcode.js?v=1"></script>
<!-- ที่อยู่ parkhere-api: ตอน deploy ขั้นตอน build เขียน config.js (window.PH_API_BASE) ในเครื่องไม่มีไฟล์นี้ได้ (คัดลอกจาก config.example.js) จะใช้ค่าเริ่มต้นในเครื่อง -->
<script src="config.js?v=1"></script>
<script src="slotname.js?v=1"></script>
<script src="script.js?v=39"></script>
<script src="admin-shortcut.js?v=1"></script>
</body>
</html>
